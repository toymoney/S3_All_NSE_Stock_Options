name: S3 stock option alerts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = connection check; run = market session; once = one scan tick'
        required: true
        default: test
        type: choice
        options:
          - test
          - run
          - once

  schedule:
    - cron: '27 3 * * 1-5'   # 08:57 IST
    - cron: '37 8 * * 1-5'   # 14:07 IST
    - cron: '47 10 * * 1-5'  # 16:17 IST report recovery

permissions:
  contents: write

concurrency:
  group: s3-stock-options-state
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Check out scanner code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline checks
        run: python -m unittest discover -s tests -v

      - name: Open persistent journal branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin s3-stock-state >/dev/null 2>&1; then
            git fetch origin s3-stock-state
            git worktree add -B s3-stock-state .s3-state FETCH_HEAD
          else
            empty_tree=$(git hash-object -t tree /dev/null)
            state_commit=$(git commit-tree "$empty_tree" -m 'Initialize S3 stock journal')
            git worktree add -b s3-stock-state .s3-state "$state_commit"
          fi

      - name: Scan and send Telegram alerts
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          STATE_DIR: .s3-state
          GIT_STATE: 'true'
          SCANNER_MODE: ${{ inputs.mode || 'run' }}
          PYTHONUNBUFFERED: '1'

          # Q requires every agreed quality condition to pass.
          MAIN_RULES: 'Q'

          # Disable the alternative P alert route.
          MAIN_ALSO_IF: ''

          # Keep observations for accepted and rejected candidates.
          OBSERVE_ALL: 'true'

          # Also retain available neighbouring-strike observations.
          OBSERVE_BAND: 'true'

        run: python stock_s3_bot.py --mode "$SCANNER_MODE"

      - name: Save pending reports and journal on exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .s3-state/state.json ]; then
            git -C .s3-state add state.json reports

            if [ -d .s3-state/observations ]; then
              git -C .s3-state add observations
            fi

            if ! git -C .s3-state diff --cached --quiet; then
              git -C .s3-state commit -m 'Checkpoint S3 journal on exit [skip ci]'
            fi

            git -C .s3-state push origin HEAD:s3-stock-state
          fi
